name: Sincroniza labels

on:
  push:
    branches: [main]
    paths: [labels.json]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Labels em todos os repos da org
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::PROJECT_TOKEN não configurado"; exit 0; fi
          python3 scripts/sync_labels.py --org ${{ github.repository_owner }}
